[project]
name = "rcmd"
version = "0.1.0"
description = "Personal command knowledge base: import shell history, annotate, tag, search, recall"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rcmd = "rcmd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcmd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
